name: Build desktop apps

on:
  workflow_dispatch:
    inputs:
      target:
        description: 构建平台
        type: choice
        options: [all, windows-x64, macos-arm64, macos-x86_64]
        default: all

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2022
            architecture: x64
            requirements: windows
          - target: macos-arm64
            runner: macos-15
            architecture: arm64
            requirements: mac
          - target: macos-x86_64
            runner: macos-15-intel
            architecture: x64
            requirements: mac
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      HANZI_PROTECT: '1'
    steps:
      - name: Select platform
        id: select
        shell: bash
        env:
          REQUESTED: ${{ inputs.target }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$REQUESTED" = all ] || [ "$REQUESTED" = "$TARGET" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.select.outputs.enabled == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.select.outputs.enabled == 'true'
        with:
          python-version: '3.11'
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: |
            packaging/requirements-*.txt
            requirements-dev.txt
            vendor/*.whl
      - name: Install build and test dependencies
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: |
          python -m pip install --timeout 120 --retries 5 --only-binary=:all: -r packaging/requirements-${{ matrix.requirements }}.txt
      - name: Validate dependencies and architecture
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: |
          python -m pip check
          python packaging/build_desktop.py --check --target "${{ matrix.target }}"
      - name: Test desktop and processing
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: python -m pytest -q --junitxml=build/test-results.xml
      - name: Configure MSVC
        if: steps.select.outputs.enabled == 'true' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: Build, smoke-test and archive
        if: steps.select.outputs.enabled == 'true'
        shell: bash
        run: python packaging/build_desktop.py --target "${{ matrix.target }}"
      - name: Upload desktop archive
        if: steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hanzi-mask-${{ matrix.target }}-${{ github.run_number }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always() && steps.select.outputs.enabled == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.run_number }}
          path: |
            build/test-results.xml
            build/code-protection/manifest.json
            build/desktop/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14
