[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanzi-mask"
version = "1.0.2"
description = "字形换底客户端：拓片单字复核、自动备份原位置保存与黑底白字导出"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<13",
  "scipy>=1.11,<2",
  "PySide6>=6.6,<7",
]

[project.optional-dependencies]
platform = [
  "hanzi-update==0.1.9",
  "hanzi-auth==0.2.15",
]

[project.scripts]
hanzi-mask = "hanzi_mask.cli:main"
hanzi-mask-desktop = "ui.window:main"

[tool.setuptools.packages.find]
include = ["hanzi_mask*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
